<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario — Sibeli</title>
  <script>document.documentElement.dataset.tema = localStorage.getItem('tema') || 'claro';</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-usuario="{{ usuario }}">

  <header class="header">
    <img src="/static/salem-logo.png" alt="Logo SALEM">
    <span class="espacio"></span>
    <a href="/" class="link-nav">Inicio</a>
    <a href="/analisis" class="link-nav">Análisis 📊</a>
    <a href="/tutor" class="link-nav activo">Sibeli ✨</a>
    <a href="/reportes" class="link-nav">Reportes 🖨️</a>
    <a href="/configuracion" class="link-nav">Config ⚙️</a>
    <button type="button" class="link-nav boton-tema" id="btn-tema" onclick="alternarTema()" title="Cambiar claro/oscuro">🌙</button>
    <a href="/logout" class="link-nav salir">Salir</a>
  </header>

  <main class="zona-chat">
    <div class="tarjeta tarjeta-chat">

      <!-- Cabecera compacta: retrato + nombre + herramientas -->
      <div class="cabecera-chat">
        <img src="/static/sibeli.png" alt="Sibeli" class="avatar-sibeli">
        <div class="cabecera-texto">
          <div class="chat-titulo">Sibeli</div>
          <div class="chat-subtitulo">Tutora personal</div>
        </div>
        <div class="acciones-chat">
          <select id="nivel-profundidad" class="select-mini" title="Profundidad de las respuestas">
            <option value="superficial">🌊 Síntesis</option>
            <option value="normal" selected>📚 Normal</option>
            <option value="profundo">🔬 Profundo</option>
            <option value="ultra">🧠 Rigor</option>
          </select>
          <button type="button" class="boton-icono" onclick="alternarBusqueda()" title="Buscar en el historial">🔍</button>
          <button type="button" class="boton-icono" onclick="exportarChat()" title="Exportar a Markdown">💾</button>
          <button type="button" class="boton-icono" onclick="pedirResumenEntrada()" title="Guardar sesión como entrada de estudio">📥</button>
          <button type="button" class="boton-icono" onclick="borrarChat()" title="Borrar historial">🗑️</button>
        </div>
      </div>

      <!-- Búsqueda: escondida, aparece con 🔍 y se cierra con ✖ -->
      <div class="barra-busqueda" id="barra-busqueda" hidden>
        <input type="text" id="buscar-chat" placeholder="Buscar en el historial…" oninput="buscarEnChat(this.value)">
        <button type="button" class="boton-icono" onclick="cerrarBusqueda()" title="Cerrar búsqueda">✖</button>
      </div>

      <!-- El lienzo del chat: ahora respira y ocupa todo lo libre -->
      <div class="lienzo-chat" id="lienzo-chat"></div>

      <!-- Atajos: cajón escondido que se abre con ⚡ -->
      <div class="atajos-chat" id="atajos-chat" hidden>
        <button type="button" class="boton-chip"
          onclick="enviarAtajo('Explicame con peras y manzanas lo que estudié hoy según mi diario.')">📖 Explicame lo de hoy</button>
        <button type="button" class="boton-chip"
          onclick="enviarAtajo('Tomame lección de lo último que estudié, una pregunta por vez.')">🧠 Tomame lección</button>
        <button type="button" class="boton-chip"
          onclick="enviarAtajo('Ayudame a resumir en 5 puntos claros mi última entrada de estudio.')">✍️ Resumí conmigo</button>
      </div>

      <!-- Documentos elegidos con 📎 y cajón de selección -->
      <div class="docs-elegidos" id="docs-elegidos"></div>
      <div class="cajon-docs" id="cajon-docs" hidden>
        <div class="docs-titulo">📎 Elegí hasta 2 documentos para tu próxima pregunta:</div>
        <div class="docs-lista" id="docs-lista"></div>
      </div>

      <!-- Fila de escritura: ⚡ atajos + cajita + enviar -->
      <form class="fila-chat" id="form-chat">
        <button type="button" class="boton-icono" onclick="alternarAtajos()" title="Atajos rápidos">⚡</button>
        <button type="button" class="boton-icono" onclick="alternarDocs()" title="Adjuntar documento de tu carpeta">📎</button>
        <input type="text" id="campo-chat" placeholder="Escribile a Sibeli…" autocomplete="off" required>
        <button class="boton" type="submit">➤</button>
      </form>

    </div>
  </main>

  <!-- Modal: de sesión a entrada -->
  <div class="modal-fondo" id="modal-entrada" hidden onclick="if (event.target === this) cerrarModalEntrada()">
    <div class="modal-caja modal-ancho">
      <h3>📥 Guardar sesión como entrada</h3>
      <p class="ayuda">Sibeli resumió la charla. Revisá, elegí temática, tipos y minutos, y guardá: la racha y la blockchain hacen el resto.</p>
      <label>Temática</label>
      <select id="entrada-tematica-chat"></select>
      <label>Tipos de estudio</label>
      <div class="caja-tipos" id="caja-tipos-chat"></div>
      <label>Minutos dedicados</label>
      <input type="number" id="entrada-minutos-chat" min="1" value="25">
      <label>Descripción</label>
      <input type="text" id="entrada-descripcion-chat">
      <label>Resumen</label>
      <textarea id="entrada-resumen-chat" rows="5"></textarea>
      <label>Observaciones</label>
      <textarea id="entrada-observaciones-chat" rows="3"></textarea>
      <div class="fila-botones" style="margin-top:12px;">
        <button type="button" class="boton boton-dorado" onclick="guardarEntradaDesdeChat()">Guardar entrada ✅</button>
        <button type="button" class="boton boton-suave" onclick="cerrarModalEntrada()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/tema.js"></script>
  <script src="/static/tutor.js"></script>
</body>
</html>
